server:
  port: 8080
  servlet:
    context-path: /ai-poc

spring:  
  application:
    name: spring-ai-poc
  main:
    banner-mode: off
  datasource: 
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/AI_POC
    username: ai_poc_usr
    password: ai_poc_pwd
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    show-sql: true

  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        max-document-batch-size: 100
        schema-name: public
        table-name: vector_store
        schema-validation: true   
    google:
      genai:
        api-key: ${SPRING_AI_GOOGLE_GENAI_API_KEY}
        project-id: gen-lang-client-0142573248
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.7
            #max-output-tokens: 1024
        embedding:
          api-key: ${SPRING_AI_GOOGLE_GENAI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              task-type: RETRIEVAL_DOCUMENT
              dimensions: ${spring.ai.vectorstore.pgvector.dimensions}                  

logging:
  level:
    root: INFO
    #org.springframework.web: DEBUG
    #org.springframework.data: DEBUG
  file:
    name: logs/spring-ai-poc.log
                     
chat:
  memory:
    enabled: true
    max-messages: 10

---
      
spring:
  config:
    activate: 
      on-profile: local-gcp
  datasource: 
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/AI_POC
    username: ai_poc_usr
    password: AI_poc_pwd1

---
  
spring:
  config:
    activate: 
      on-profile: gcp
  datasource: 
    driver-class-name: org.postgresql.Driver
    #url: jdbc:postgresql://gen-lang-client-0142573248:us-east1:spring-ai-poc-db:5432/AI_POC
    url: jdbc:postgresql:///AI_POC?cloudSqlInstance=gen-lang-client-0142573248:us-east1:spring-ai-poc-db&socketFactory=com.google.cloud.sql.postgres.SocketFactory&useSSL=false
    username: ai_poc_usr
    password: AI_poc_pwd1
    #user_name: postgres
    #pass_word: Postgres1!
  cloud:
    gcp:
      project-id: gen-lang-client-0142573248
      sql:
        instance-connection-name: gen-lang-client-0142573248:us-east1:spring-ai-poc-db
        database-name: AI_POC
              